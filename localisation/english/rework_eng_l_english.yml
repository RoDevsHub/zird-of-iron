AST_develop_new_zealand:0 "Develop New Zealand"
AST_develop_new_zealand_desc:0 "New Zealand's potential as a strategic asset in the Pacific cannot be overlooked. By investing in its infrastructure and industry, we can bolster our regional presence, support Allied operations, and ensure the security of this vital dominion."


